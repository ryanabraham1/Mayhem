plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'mayhemlib'
version = project.findProperty('mayhemVersion') ?: '2026.3.0'

def wpilibVersion = '2026.2.2'
def phoenixVersion = '26.3.0'
def jacksonVersion = '2.19.2'

repositories {
    mavenCentral()
    maven { url = 'https://frcmaven.wpi.edu/artifactory/release/' }
    maven { url = 'https://maven.ctr-electronics.com/release/' }
    maven { url = 'https://file.tavsys.net/sleipnir/maven/release/' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.current() }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17   // WPILib 2026 / roboRIO runs Java 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

javadoc { options.addStringOption('Xdoclint:none', '-quiet') }

dependencies {
    // Provided by the robot project (WPILib + vendordeps); never bundled.
    compileOnly "edu.wpi.first.wpimath:wpimath-java:$wpilibVersion"
    compileOnly "edu.wpi.first.wpiutil:wpiutil-java:$wpilibVersion"
    compileOnly "edu.wpi.first.wpiunits:wpiunits-java:$wpilibVersion"
    compileOnly "edu.wpi.first.ntcore:ntcore-java:$wpilibVersion"
    compileOnly "edu.wpi.first.wpilibj:wpilibj-java:$wpilibVersion"
    compileOnly "edu.wpi.first.hal:hal-java:$wpilibVersion"
    compileOnly "edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:$wpilibVersion"
    compileOnly "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    compileOnly "org.ejml:ejml-simple:0.44.0"
    compileOnly "com.ctre.phoenix6:wpiapi-java:$phoenixVersion"
    compileOnly "org.wpilib.math:SleipnirJava-java:2026.0.1"

    testImplementation "edu.wpi.first.wpimath:wpimath-java:$wpilibVersion"
    testImplementation "edu.wpi.first.wpiutil:wpiutil-java:$wpilibVersion"
    testImplementation "edu.wpi.first.wpiunits:wpiunits-java:$wpilibVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    testImplementation "org.ejml:ejml-simple:0.44.0"
    testImplementation "us.hebi.quickbuf:quickbuf-runtime:1.4"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat = 'full' }
    systemProperty 'mayhem.testdata', "${rootDir}/src/test/resources"
}

publishing {
    publications {
        java(MavenPublication) {
            artifactId = 'MayhemLib-java'
            from components.java
        }
    }
    repositories {
        maven { name = 'local'; url = layout.buildDirectory.dir('repos/releases') }
        // GradleRIO always searches ~/wpilib/<year>/maven, so publishing here makes the vendordep
        // work offline with no extra repository configuration.
        maven { name = 'frcLocal'; url = "${System.getProperty('user.home')}/wpilib/2026/maven" }
    }
}

def vendordepFile = layout.buildDirectory.file('vendordeps/MayhemLib.json')

tasks.register('vendordepJson') {
    description = 'Generates the MayhemLib vendordep JSON'
    def mavenUrl = project.findProperty('mavenUrl') ?: ''
    inputs.property('version', version)
    inputs.property('mavenUrl', mavenUrl)
    outputs.file(vendordepFile)
    doLast {
        def json = groovy.json.JsonOutput.toJson([
            fileName        : 'MayhemLib.json',
            name            : 'MayhemLib',
            version         : version,
            frcYear         : '2026',
            uuid            : 'e3b1f4c2-6d2a-4c55-9a3e-6d6179686d31',
            mavenUrls       : mavenUrl ? [mavenUrl] : [],
            jsonUrl         : '',
            javaDependencies: [[groupId: 'mayhemlib', artifactId: 'MayhemLib-java', version: version]],
            jniDependencies : [],
            cppDependencies : [],
        ])
        def f = vendordepFile.get().asFile
        f.parentFile.mkdirs()
        f.text = groovy.json.JsonOutput.prettyPrint(json) + '\n'
    }
}

tasks.register('installVendordep') {
    description = 'Publishes to ~/wpilib/2026/maven and copies MayhemLib.json into -ProbotProject=<dir>/vendordeps'
    dependsOn 'publishJavaPublicationToFrcLocalRepository', 'vendordepJson'
    doLast {
        def robot = project.findProperty('robotProject')
        if (!robot) {
            println "Published to ~/wpilib/2026/maven. Pass -ProbotProject=<path> to also install the vendordep JSON."
            return
        }
        def dest = new File(robot.toString(), 'vendordeps')
        dest.mkdirs()
        def src = vendordepFile.get().asFile
        new File(dest, 'MayhemLib.json').text = src.text
        println "Installed ${dest}/MayhemLib.json"
    }
}
