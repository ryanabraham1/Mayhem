[project]
name = "mayhem-solver"
version = "0.5.0"
description = "Time-optimal swerve trajectory solver for FRC (Mayhem)"
authors = [
    { name = "Ryan Abraham", email = "ryan.ryanabraham@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "casadi>=3.8.1",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pydantic>=2",
    "shapely>=2.1",
    "websockets>=17.1",
]

[project.scripts]
mayhem-solver = "mayhem_solver.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: solver benchmark scenarios that run the optimizer"]
