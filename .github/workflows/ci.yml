name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  solver:
    name: Solver tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: solver/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  sidecar:
    # Freezes the solver with PyInstaller and runs a real solve through the frozen binary,
    # so packaging regressions (missing CasADi plugins, data files, spawn issues) fail CI.
    name: Sidecar smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: solver/uv.lock
      - if: runner.os != 'Windows'
        run: scripts/build-sidecar.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-sidecar.ps1

  java:
    name: MayhemLib (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  frontend:
    name: Frontend tests + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  desktop:
    name: Tauri shell (clippy, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # tauri-build insists the externalBin exists; a placeholder is enough to type-check.
      # Also needs ../dist to exist for generate_context!().
      - name: Placeholder sidecar + frontend dist
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""; [[ "$triple" == *windows* ]] && ext=".exe"
          mkdir -p binaries ../dist
          touch "binaries/mayhem-solver-$triple$ext" ../dist/index.html
          chmod +x "binaries/mayhem-solver-$triple$ext"
      - run: cargo clippy --locked -- -D warnings
