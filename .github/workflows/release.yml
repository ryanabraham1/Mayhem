name: Release

# Push a tag like v0.1.0 to build installers and publish a GitHub Release once
# every supported platform build succeeds. Failed builds leave a draft for inspection.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PNPM_VERSION: "11"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # vX.Y.Z-rcN builds a release candidate: published as a GitHub prerelease, which never
          # becomes releases/latest, so installed apps aren't offered it as an update.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] || {
            echo "Use a version tag like v0.1.0 (or v0.1.0-rc1 for a release candidate)" >&2; exit 1;
          }
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .ref >/dev/null
          # Reuse the release on reruns. GitHub requires assets to be attached
          # before publishing when immutable releases are enabled.
          if id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id 2>/dev/null)"; then
            echo "Reusing release $id"
          else
            id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                   -f tag_name="${TAG}" -f name="Mayhem ${TAG}" -F draft=true -F prerelease="$([[ "$TAG" == *-rc* ]] && echo true || echo false)" \
                   -f body="Download the installer for your system below: .dmg for macOS (choose Apple Silicon or Intel), -setup.exe for Windows, or .AppImage or .deb for Linux.

          Mayhem 0.6.0 and later update themselves: the app offers new releases in a banner (or Settings, About & updates).

          The Windows installer is not code-signed. If SmartScreen stops it, click More info, then Run anyway.

          macOS builds are not notarized. After dragging Mayhem.app into Applications, run \`xattr -dr com.apple.quarantine /Applications/Mayhem.app\` if macOS blocks the first launch.

          To add MayhemLib to a robot project, use WPILib's Manage Vendor Libraries, Install new libraries (online), and paste \`https://ryanabraham1.github.io/Mayhem/MayhemLib.json\`. For offline use, unzip \`MayhemLib-maven.zip\` into \`~/wpilib/2026/maven\` (Windows: \`C:\\Users\\Public\\wpilib\\2026\\maven\`) and copy \`MayhemLib.json\` into your robot project's \`vendordeps/\`." \
                   --jq .id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            bundles: app,dmg
          - name: macOS x64
            os: macos-15-intel
            bundles: app,dmg
          # Oldest supported Ubuntu -> widest glibc compatibility for the AppImage / .deb.
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb
          # NSIS only: a per-user install (no admin prompt) that the updater can run silently.
          - name: Windows x64
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev build-essential file

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: solver/uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build solver sidecar (PyInstaller) + smoke test
        if: runner.os != 'Windows'
        run: scripts/build-sidecar.sh
      - name: Build solver sidecar (PyInstaller) + smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Set app version from tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), p = "app/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.TAG.replace(/^v/, "").replace(/-.*$/, "");
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("version", c.version);'

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Check updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || {
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repo secrets (see docs/BUILDING.md, Auto-update)." >&2
            exit 1
          }

      - uses: tauri-apps/tauri-action@v0.6.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update artifacts (.app.tar.gz, .AppImage, .deb, -setup.exe -> .sig). The matching
          # public key is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # PyInstaller onefile binaries break if stripped (linuxdeploy strips AppImage contents).
          NO_STRIP: "true"
          # Skip the Finder AppleScript window-layout step when building the DMG headless.
          CI: "true"
        with:
          projectPath: app
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.TAG }}
          releaseDraft: true
          # Parallel jobs racing to merge one latest.json can drop platforms; the publish job
          # writes it once from the uploaded .sig files instead.
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: mayhem-${{ env.TAG }}-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: warn

  mayhemlib:
    name: MayhemLib (maven repo + vendordep)
    needs: create-release
    runs-on: ubuntu-latest
    # Two tags pushed close together must not race on the gh-pages branch.
    concurrency:
      group: mayhemlib-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, publish to build/repos/releases
        working-directory: lib
        run: ./gradlew build vendordepJson publishJavaPublicationToLocalRepository
      - name: Package
        working-directory: lib/build
        run: |
          (cd repos/releases && zip -qr ../../MayhemLib-maven.zip .)
          cp vendordeps/MayhemLib.json MayhemLib.json
      - uses: actions/upload-artifact@v4
        with:
          name: MayhemLib-${{ env.TAG }}
          path: |
            lib/build/MayhemLib-maven.zip
            lib/build/MayhemLib.json
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" lib/build/MayhemLib-maven.zip lib/build/MayhemLib.json \
            --repo "${GITHUB_REPOSITORY}" --clobber

      # Hosts the maven repo and MayhemLib.json on GitHub Pages (gh-pages branch) so users can
      # install with "Install new libraries (online)" and get update checks. Release candidates
      # are not hosted. A version that is already hosted is left untouched (see the script).
      - name: Host on GitHub Pages
        if: ${{ !contains(env.TAG, '-rc') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version lib/build/vendordeps/MayhemLib.json)"
          PAGES_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            scripts/publish-pages.sh lib/build/repos/releases lib/build/vendordeps/MayhemLib.json "$VERSION"

  publish:
    name: Publish complete release
    needs: [create-release, desktop, mayhemlib]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets"
          [ "$(printf '%s\n' "$assets" | grep -cE '\.dmg$')" -ge 2 ]
          for pattern in '\.AppImage$' '\.deb$' '_x64-setup\.exe$' '^MayhemLib-maven\.zip$' '^MayhemLib\.json$'; do
            printf '%s\n' "$assets" | grep -qE "$pattern"
          done

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: app/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      # The app reads releases/latest/download/latest.json (tauri.conf.json plugins.updater), and
      # "latest" only moves once this release is published, so installs never see a partial release.
      - name: Write updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sigs && cd sigs
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern '*.sig'
          ls -l
          python3 - <<'PY'
          import base64, glob, json, os, sys, datetime
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]

          # Installed apps reject updates not signed by the key behind plugins.updater.pubkey, so
          # a wrong TAURI_SIGNING_PRIVATE_KEY secret must fail here, not in users' hands.
          # Keys and .sig files are base64 of minisign text; line 2 is base64(alg[2] + key id[8] + ...).
          def key_id(b64_text):
              return base64.b64decode(base64.b64decode(b64_text).decode().splitlines()[1])[2:10]
          conf = json.load(open("../app/src-tauri/tauri.conf.json"))
          want = key_id(conf["plugins"]["updater"]["pubkey"])
          bad = [s for s in glob.glob("*.sig") if key_id(open(s).read().strip()) != want]
          if bad:
              sys.exit(f"{bad} not signed with the key matching plugins.updater.pubkey; check the TAURI_SIGNING_PRIVATE_KEY secret")
          # updater target key(s) -> glob for the signed artifact's .sig
          wanted = {
              ("darwin-aarch64", "darwin-aarch64-app"): "*aarch64*.app.tar.gz.sig",
              ("darwin-x86_64", "darwin-x86_64-app"): "*x64*.app.tar.gz.sig",
              ("linux-x86_64", "linux-x86_64-appimage"): "*amd64.AppImage.sig",
              ("linux-x86_64-deb",): "*amd64.deb.sig",
              ("windows-x86_64", "windows-x86_64-nsis"): "*x64-setup.exe.sig",
          }
          platforms = {}
          for keys, pattern in wanted.items():
              hits = glob.glob(pattern)
              if len(hits) != 1:
                  sys.exit(f"expected exactly one {pattern}, found {hits}")
              sig = hits[0]
              entry = {
                  "signature": open(sig).read().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{sig[:-len('.sig')]}",
              }
              for k in keys:
                  platforms[k] = entry
          manifest = {
              "version": tag.lstrip("v"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("../latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          cd .. && gh release upload "${TAG}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$TAG" == *-rc* ]]; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease --latest=false
          else
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
